[package]
name = "snipjet-backend"
version = "0.2.2"
description = "SnipJet clipboard manager backend"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[package.metadata]
name = "SnipJet"
description = "Advanced clipboard manager"
authors = ["you"]
category = "utilities"
license = "MIT"
repository = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
regex = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
clipboard-rs = "0.3.2"
image = "0.24"       # 用于处理图片对象
base64 = "0.21"      # 用于将图片转字符串
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rdev = "0.5"       # 用于监听点击外部
enigo = "0.1.3"      # 用于方便地输出文本
env_logger = "0.10"   # 用于日志初始化
serde_yaml = "0.9"    # 用于解析YAML文件
nanohtml2text = "0.1"
tauri-plugin-fs = "2.4.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-autostart = "2"
docx-rs = "0.4"
pulldown-cmark = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "0.1", features = ["server", "macros", "transport-sse-server"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
dirs = "5"
encoding_rs = "0.8"
# 更新检查：访问 GitHub Releases API 与下载安装包。
# 关闭默认特性以使用 native-tls（Windows 走 schannel），避免 rustls/aws-lc-rs 的额外构建依赖。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
    "charset",
    "system-proxy",
] }
tauri-plugin-dialog = "2"
# 单实例：重复启动时把参数转发给已有实例并立即退出，避免第二个实例
# 再起一套剪贴板监听去抢全局快捷键、并发写同一个 sqlite。
# Windows 上以命名互斥体 {identifier}-sim 判定实例身份，
# 所以 dev 与安装版要共存，必须在 dev 下换 identifier（见 tauri.dev.conf.json）。
tauri-plugin-single-instance = "2"

# 仅在Windows平台下添加windows依赖
[target.'cfg(windows)'.dependencies]
# 读取开机自启动注册项（与 auto-launch 使用同一版本，不新增编译产物）
winreg = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }

[[bin]]
name = "snipjet"
path = "src/main.rs"

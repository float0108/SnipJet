<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title data-i18n="settings.pageTitle">SnipJet 设置</title>
    <script>
      // 标记首帧渲染阶段：禁用所有过渡/动画，
      // 避免设置异步应用时 toggle 等控件播放状态切换动画（初始化完成后由 main.js 移除）
      document.documentElement.classList.add('preload');
    </script>
    <!-- 首帧渲染前同步应用主题/字体/缩放，避免窗口打开后跳变 -->
    <script src="./bootstrap.js"></script>
    <link rel="stylesheet" href="./common/style.css" />
    <link rel="stylesheet" href="./common/controls.css" />
    <link rel="stylesheet" href="./views/settings/settings.css" />
    <link rel="stylesheet" href="./common/icon.css" />
  </head>
  <body>
    <div class="settings-container">
      <!-- data-section 为语言无关的分区标识，与 ui.js 的 SECTIONS 键一一对应 -->
      <nav
        class="sidebar"
        aria-label="设置分区"
        data-i18n-aria-label="settings.sidebar.ariaLabel"
      >
        <button
          type="button"
          class="sidebar-item active"
          aria-current="true"
          data-section="general"
          data-i18n="settings.section.general"
        ></button>
        <button
          type="button"
          class="sidebar-item"
          data-section="appearance"
          data-i18n="settings.section.appearance"
        ></button>
        <button
          type="button"
          class="sidebar-item"
          data-section="shortcuts"
          data-i18n="settings.section.shortcuts"
        ></button>
        <button
          type="button"
          class="sidebar-item"
          data-section="clipboard"
          data-i18n="settings.section.clipboard"
        ></button>
        <button
          type="button"
          class="sidebar-item"
          data-section="storage"
          data-i18n="settings.section.storage"
        ></button>
        <button
          type="button"
          class="sidebar-item"
          data-section="advanced"
          data-i18n="settings.section.advanced"
        ></button>
      </nav>

      <div class="content">
        <div class="header-top" data-tauri-drag-region>
          <!-- 标题随激活分区变化（含语言切换），由 ui.js 的 updateSectionTitle 写入；
               data-i18n 仅作为默认分区（常规）的静态兜底 -->
          <h1 class="section-title" data-i18n="settings.section.general"></h1>
          <div class="header-actions" data-tauri-drag-region="false">
            <button
              class="window-close-btn"
              id="close-button"
              aria-label="关闭窗口"
              data-i18n-aria-label="settings.close.ariaLabel"
            >
              <svg
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- 常规 -->
        <div id="general-content" class="settings-section active">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.startupLaunch"></div>
              <div class="setting-description" data-i18n="settings.general.startupLaunchDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="startup-launch" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item" id="startup-status-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.startupStatus"></div>
              <div
                class="startup-path"
                id="startup-path"
                data-i18n="settings.general.startupPathEmpty"
              ></div>
            </div>
            <div class="setting-control">
              <span
                id="startup-status"
                class="status-badge status-stopped"
                data-i18n="settings.general.startupDisabled"
              ></span>
              <!-- 程序移动/重装后注册项可能仍指向旧路径，点此按当前路径重新注册 -->
              <button
                type="button"
                class="reset-btn"
                id="startup-path-reset"
                title="重新注册自启动"
                aria-label="重新注册自启动"
                data-i18n-title="settings.general.startupPathReset"
                data-i18n-aria-label="settings.general.startupPathReset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.language"></div>
            </div>
            <div class="setting-control">
              <!-- 语言选项使用语言自称，不随界面语言翻译 -->
              <select class="select-input" id="language">
                <option value="cn">简体中文</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>

          <div class="setting-divider"></div>

          <!-- 软件更新：手动检查 GitHub / Gitee Release，命中后下载/安装 -->
          <div class="setting-section-title" data-i18n="settings.blocks.update"></div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.updateSource"></div>
              <div class="setting-description" data-i18n="settings.general.updateSourceDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 选项取固定值 github / gitee，切换时同步更新下方仓库链接的占位提示 -->
              <select class="select-input" id="update-source">
                <option value="github" data-i18n="settings.options.updateSource.github"></option>
                <option value="gitee" data-i18n="settings.options.updateSource.gitee"></option>
              </select>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.updateRepo"></div>
              <div class="setting-description" data-i18n="settings.general.updateRepoDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 占位符由 updater.js 根据当前源写入对应域名示例 -->
              <input
                type="text"
                class="text-input"
                id="update-repo"
                spellcheck="false"
              />
            </div>
          </div>

          <!-- 仅便携版显示：更新包保存目录 -->
          <div class="setting-item" id="update-download-dir-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.downloadDir"></div>
              <div class="setting-description" data-i18n="settings.general.downloadDirDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 占位符由 updater.js 写入系统默认下载目录 -->
              <input type="text" class="text-input" id="update-download-dir" readonly />
              <button
                type="button"
                class="btn btn-cancel update-btn"
                id="update-browse-btn"
                data-i18n="settings.general.browse"
              ></button>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.general.currentVersion"></div>
              <!-- 版本号与安装类型由 updater.js 写入 -->
              <div class="setting-description" id="update-install-type"></div>
            </div>
            <div class="setting-control">
              <button
                type="button"
                class="btn btn-confirm update-btn"
                id="check-update-btn"
                data-i18n="settings.general.checkUpdateBtn"
              ></button>
            </div>
          </div>

          <!-- 检查/下载结果（由 updater.js 渲染） -->
          <div class="update-result" id="update-result" hidden></div>
        </div>

        <!-- 外观 -->
        <div id="appearance-content" class="settings-section">
          <div class="setting-section-title" data-i18n="settings.blocks.theme"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.followSystem"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="follow-system" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.themeMode"></div>
              <!-- 仅在开启「跟随系统」时显示：此时主题模式只用于选择编辑哪套配色 -->
              <div
                class="setting-description"
                id="theme-mode-hint"
                data-i18n="settings.appearance.themeModeHint"
              ></div>
            </div>
            <div class="setting-control">
              <!-- 主题模式：☀️ 浅色 / 🌙 深色。开启「跟随系统」后，这里只用于选择编辑哪套主题色 -->
              <div
                class="segmented"
                id="theme"
                role="group"
                data-i18n-aria-label="settings.appearance.themeMode"
              >
                <button
                  type="button"
                  class="segmented-btn"
                  data-theme-mode="light"
                  data-i18n-title="settings.options.theme.light"
                  data-i18n-aria-label="settings.options.theme.light"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="15"
                    height="15"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M4.93 4.93l1.41 1.41"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="M6.34 17.66l-1.41 1.41"></path>
                    <path d="M19.07 4.93l-1.41 1.41"></path>
                  </svg>
                </button>
                <button
                  type="button"
                  class="segmented-btn"
                  data-theme-mode="dark"
                  data-i18n-title="settings.options.theme.dark"
                  data-i18n-aria-label="settings.options.theme.dark"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="15"
                    height="15"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <!-- 图标由脚本写入，标识当前编辑的是浅色还是深色那一套 -->
              <div class="setting-label theme-color-label">
                <span data-i18n="settings.appearance.primaryColor"></span>
                <span class="theme-color-icon"></span>
              </div>
              <div class="setting-description" data-i18n="settings.appearance.primaryColorDesc"></div>
            </div>
            <div class="setting-control">
              <input type="color" class="color-input" id="primary-color" value="#2563eb" />
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label theme-color-label">
                <span data-i18n="settings.appearance.favoriteColor"></span>
                <span class="theme-color-icon"></span>
              </div>
              <div class="setting-description" data-i18n="settings.appearance.favoriteColorDesc"></div>
            </div>
            <div class="setting-control">
              <input type="color" class="color-input" id="favorite-color" value="#eab308" />
            </div>
          </div>

          <div class="setting-divider"></div>

          <div class="setting-section-title" data-i18n="settings.blocks.text"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.fontFamily"></div>
              <div class="setting-description" data-i18n="settings.appearance.fontFamilyDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 自定义下拉：原生 select 的弹层由系统绘制、不应用 CSS 字体，
                   无法让每个选项按自身字体预览 -->
              <div class="font-picker" id="font-family-picker">
                <button
                  type="button"
                  class="select-input font-picker-trigger"
                  id="font-family-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-label="主要字体"
                  data-i18n-aria-label="settings.appearance.fontFamily"
                >
                  <span
                    class="font-picker-label"
                    id="font-family-label"
                    data-i18n="settings.options.font.systemDefault"
                    ></span
                  >
                  <svg
                    class="font-picker-arrow"
                    viewBox="0 0 24 24"
                    width="12"
                    height="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="font-picker-menu" id="font-family-menu" role="listbox"></div>
              </div>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.fontFamilySecondary"></div>
              <div class="setting-description" data-i18n="settings.appearance.fontFamilySecondaryDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 重置键：清除次要字体（未设置时置灰） -->
              <button
                type="button"
                class="reset-btn"
                id="font-family-secondary-reset"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.appearance.reset"
                data-i18n-aria-label="settings.appearance.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <!-- 主要字体缺少字形时用次要字体兜底 -->
              <div class="font-picker" id="font-family-secondary-picker">
                <button
                  type="button"
                  class="select-input font-picker-trigger"
                  id="font-family-secondary-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-label="次要字体"
                  data-i18n-aria-label="settings.appearance.fontFamilySecondary"
                >
                  <span
                    class="font-picker-label"
                    id="font-family-secondary-label"
                    data-i18n="settings.options.font.none"
                    ></span
                  >
                  <svg
                    class="font-picker-arrow"
                    viewBox="0 0 24 24"
                    width="12"
                    height="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="font-picker-menu" id="font-family-secondary-menu" role="listbox"></div>
              </div>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.fontSize"></div>
              <div class="setting-description" data-i18n="settings.appearance.fontSizeDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 重置键：恢复默认字号（已是默认值时置灰） -->
              <button
                type="button"
                class="reset-btn"
                id="font-size-reset"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.appearance.reset"
                data-i18n-aria-label="settings.appearance.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <input
                type="number"
                class="number-input"
                id="font-size"
                min="10"
                max="20"
                step="0.5"
                value="14"
              />
            </div>
          </div>

          <div class="setting-divider"></div>

          <div class="setting-section-title" data-i18n="settings.blocks.listWindow"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.zoomLevel"></div>
              <div class="setting-description" data-i18n="settings.appearance.zoomLevelDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="zoom-level"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.latestPreviewLines"></div>
              <div
                class="setting-description"
                data-i18n="settings.appearance.latestPreviewLinesDesc"
              ></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="latest-preview-lines"
                min="1"
                max="10"
                step="1"
              />
              <span class="unit-label" data-i18n="settings.units.lines"></span>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.historyPreviewLines"></div>
              <div
                class="setting-description"
                data-i18n="settings.appearance.historyPreviewLinesDesc"
              ></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="history-preview-lines"
                min="1"
                max="10"
                step="1"
              />
              <span class="unit-label" data-i18n="settings.units.lines"></span>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.previewMaxChars"></div>
              <div class="setting-description" data-i18n="settings.appearance.previewMaxCharsDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="preview-max-chars"
                min="100"
                max="2000"
                step="100"
              />
              <span class="unit-label" data-i18n="settings.units.chars"></span>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.imagePreviewSize"></div>
              <div class="setting-description" data-i18n="settings.appearance.imagePreviewSizeDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="image-preview-size"
                min="0"
                max="100"
                step="10"
              />
              <span class="unit-label" data-i18n="settings.units.percent"></span>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.appearance.animationSpeed"></div>
              <div class="setting-description" data-i18n="settings.appearance.animationSpeedDesc"></div>
            </div>
            <div class="setting-control">
              <select class="select-input" id="animation-speed">
                <option value="off" data-i18n="settings.options.animationSpeed.off"></option>
                <option value="fast" data-i18n="settings.options.animationSpeed.fast"></option>
                <option value="normal" data-i18n="settings.options.animationSpeed.normal"></option>
              </select>
            </div>
          </div>
        </div>

        <!-- 快捷键 -->
        <div id="shortcuts-content" class="settings-section">
          <div class="setting-item">
            <div class="setting-info">
              <div
                class="setting-label"
                data-i18n="settings.shortcuts.toggleInterface"
              ></div>
              <!-- 独立一行左对齐：点击打开弹窗，说明如何把快捷键设为 Win+V -->
              <button
                type="button"
                class="link-btn"
                id="winv-help-link"
                data-i18n="settings.shortcuts.winVHelpLink"
              ></button>
            </div>
            <div class="setting-control">
              <button
                type="button"
                class="reset-btn"
                data-clear-for="toggle-interface"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.shortcuts.reset"
                data-i18n-aria-label="settings.shortcuts.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <input
                type="text"
                class="shortcut-input"
                id="toggle-interface"
                placeholder="未设置"
                data-i18n-placeholder="settings.shortcuts.notSet"
                readonly
              />
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.shortcuts.functionPaste"></div>
            </div>
            <div class="setting-control">
              <button
                type="button"
                class="reset-btn"
                data-clear-for="function-paste"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.shortcuts.reset"
                data-i18n-aria-label="settings.shortcuts.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <input
                type="text"
                class="shortcut-input"
                id="function-paste"
                placeholder="未设置"
                data-i18n-placeholder="settings.shortcuts.notSet"
                readonly
              />
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.shortcuts.quickPasteMode"></div>
              <div class="setting-description" data-i18n="settings.shortcuts.quickPasteModeDesc"></div>
            </div>
            <div class="setting-control">
              <!-- 空值项仅用于回显「未设置」且不可直接选中；禁用快捷粘贴请用左侧重置键 -->
              <button
                type="button"
                class="reset-btn"
                data-clear-for="quick-paste-mode"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.shortcuts.reset"
                data-i18n-aria-label="settings.shortcuts.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <select class="select-input" id="quick-paste-mode">
                <option value="" disabled data-i18n="settings.shortcuts.notSet"></option>
                <option value="ctrl">Ctrl</option>
                <option value="num">NumPad</option>
              </select>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.shortcuts.rotatingPaste"></div>
              <div class="setting-description" data-i18n="settings.shortcuts.rotatingPasteDesc"></div>
            </div>
            <div class="setting-control">
              <button
                type="button"
                class="reset-btn"
                data-clear-for="rotating-paste"
                title="重置"
                aria-label="重置"
                data-i18n-title="settings.shortcuts.reset"
                data-i18n-aria-label="settings.shortcuts.reset"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </button>
              <input
                type="text"
                class="shortcut-input"
                id="rotating-paste"
                placeholder="未设置"
                data-i18n-placeholder="settings.shortcuts.notSet"
                readonly
              />
            </div>
          </div>
        </div>

        <!-- 剪贴板 -->
        <div id="clipboard-content" class="settings-section">
          <div class="setting-section-title" data-i18n="settings.blocks.record"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.clipboard.autoCopy"></div>
              <div class="setting-description" data-i18n="settings.clipboard.autoCopyDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="auto-copy" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-divider"></div>

          <div class="setting-section-title" data-i18n="settings.blocks.pasteFormat"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.clipboard.stripFormatting"></div>
              <div class="setting-description" data-i18n="settings.clipboard.stripFormattingDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="strip-formatting" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.clipboard.usePandoc"></div>
              <div class="setting-description" data-i18n="settings.clipboard.usePandocDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="use-pandoc-for-markdown" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item" id="pandoc-template-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.clipboard.pandocTemplatePath"></div>
              <div
                class="setting-description"
                data-i18n="settings.clipboard.pandocTemplatePathDesc"
              ></div>
            </div>
            <div class="setting-control">
              <!-- 示例路径保留原样，不随界面语言翻译 -->
              <input
                type="text"
                class="text-input"
                id="pandoc-template-path"
                placeholder="C:\\path\\to\\template.docx"
              />
            </div>
          </div>
        </div>

        <!-- 存储 -->
        <div id="storage-content" class="settings-section">
          <div class="setting-section-title" data-i18n="settings.blocks.autoCleanup"></div>
          <div class="setting-description block" data-i18n="settings.storage.cleanupIntro"></div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.storage.cleanupByCount"></div>
              <div class="setting-description" data-i18n="settings.storage.cleanupByCountDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="cleanup-count-enabled" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item" id="cleanup-count-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.storage.keepCount"></div>
              <div class="setting-description" data-i18n="settings.storage.keepCountDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="cleanup-count-threshold"
                min="10"
                max="100000"
                step="10"
                placeholder="例如 500"
                data-i18n-placeholder="settings.storage.keepCountPlaceholder"
              />
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.storage.cleanupByAge"></div>
              <div class="setting-description" data-i18n="settings.storage.cleanupByAgeDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="cleanup-age-enabled" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item" id="cleanup-age-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.storage.keepDays"></div>
              <div class="setting-description" data-i18n="settings.storage.keepDaysDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="cleanup-age-days"
                min="1"
                max="3650"
                step="1"
                placeholder="例如 30"
                data-i18n-placeholder="settings.storage.keepDaysPlaceholder"
              />
            </div>
          </div>
        </div>

        <!-- 高级 -->
        <div id="advanced-content" class="settings-section">
          <div class="setting-section-title" data-i18n="settings.blocks.mcp"></div>
          <div class="setting-description block" data-i18n="settings.advanced.mcpIntro"></div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.advanced.mcpEnabled"></div>
              <div class="setting-description" data-i18n="settings.advanced.mcpEnabledDesc"></div>
            </div>
            <div class="setting-control">
              <label class="toggle-switch">
                <input type="checkbox" id="mcp-enabled" />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-item" id="mcp-port-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.advanced.mcpPort"></div>
              <div class="setting-description" data-i18n="settings.advanced.mcpPortDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="mcp-port"
                min="1024"
                max="65535"
                step="1"
              />
            </div>
          </div>

          <div class="setting-item" id="mcp-status-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.advanced.mcpStatus"></div>
            </div>
            <div class="setting-control">
              <span
                id="mcp-status"
                class="status-badge status-stopped"
                data-i18n="settings.advanced.mcpStopped"
                ></span
              >
            </div>
          </div>

          <div class="setting-divider"></div>

          <div class="setting-section-title" data-i18n="settings.blocks.performance"></div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label" data-i18n="settings.advanced.searchScanLimit"></div>
              <div class="setting-description" data-i18n="settings.advanced.searchScanLimitDesc"></div>
            </div>
            <div class="setting-control">
              <input
                type="number"
                class="number-input"
                id="search-scan-limit"
                min="16"
                max="102400"
                step="1024"
                placeholder="1024"
                data-i18n-placeholder="settings.advanced.searchScanLimitPlaceholder"
              />
            </div>
          </div>
        </div>

        <div class="button-footer">
          <button class="btn btn-cancel" id="cancel-btn" data-i18n="settings.cancel"></button>
          <button class="btn btn-confirm" id="confirm-btn" data-i18n="settings.confirm"></button>
        </div>
      </div>
    </div>

    <!-- 禁用 Windows 原生 Win+V 的说明弹窗（点击快捷键旁的圆形 i 打开） -->
    <div class="modal-overlay" id="winv-help-modal">
      <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="winv-help-title"
      >
        <div class="modal-header">
          <h3
            class="modal-title"
            id="winv-help-title"
            data-i18n="settings.shortcuts.winVHelpTitle"
          ></h3>
          <button
            type="button"
            class="modal-close"
            id="winv-help-close"
            data-i18n-aria-label="settings.shortcuts.closeDialog"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <p
            class="modal-text"
            data-i18n-html="settings.shortcuts.winVHelpIntro"
          ></p>

          <ol class="modal-steps">
            <li>
              <span data-i18n-html="settings.shortcuts.winVHelpStep1"></span>
            </li>
            <li>
              <span data-i18n-html="settings.shortcuts.winVHelpStep2"></span>
              <code class="modal-code"
                >HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced</code
              >
            </li>
            <li>
              <span data-i18n-html="settings.shortcuts.winVHelpStep3"></span>
              <code class="modal-code">DisabledHotkeys</code>
            </li>
            <li>
              <span data-i18n-html="settings.shortcuts.winVHelpStep4"></span>
            </li>
            <li>
              <span data-i18n-html="settings.shortcuts.winVHelpStep5"></span>
            </li>
          </ol>

          <p
            class="modal-note"
            data-i18n-html="settings.shortcuts.winVHelpNote"
          ></p>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-confirm"
            id="winv-help-ok"
            data-i18n="settings.shortcuts.gotIt"
          ></button>
        </div>
      </div>
    </div>

    <script type="module" src="./views/settings/main.js"></script>
  </body>
</html>

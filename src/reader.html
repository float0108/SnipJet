<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="reader.pageTitle">SnipJet - 内容查看器</title>
    <!-- 首帧渲染前同步应用主题/字体/缩放，避免窗口打开后跳变 -->
    <script src="./bootstrap.js"></script>
    <link rel="stylesheet" href="./common/style.css" />
    <link rel="stylesheet" href="./common/controls.css" />
    <link rel="stylesheet" href="./views/reader/reader.css" />
    <link rel="stylesheet" href="./components/frames/text-frame.css" />
    <link rel="stylesheet" href="./components/frames/preview-frame.css" />
    <link rel="stylesheet" href="./common/icon.css" />
    <script type="module" src="./views/reader/reader.js"></script>
  </head>
  <body class="reader-body">
    <div class="reader-container">
      <div class="header">
        <div class="header-top">
          <div class="meta">
            <span class="type" id="meta-type"></span>
            <span class="time" id="meta-time"></span>
            <span class="divider" id="meta-divider">|</span>
            <span class="char-count" id="meta-count"></span>
          </div>
          <div class="header-actions">
            <!-- 纯文本/图片格式下隐藏但保留占位（visibility），避免切换时 header 高度变化导致内容抖动 -->
            <div id="view-toggle" class="view-toggle is-hidden">
              <button
                class="toggle-btn active"
                data-mode="render"
                aria-pressed="true"
                data-i18n="reader.view.render"
              ></button>
              <button
                class="toggle-btn"
                data-mode="text"
                aria-pressed="false"
                data-i18n="reader.view.text"
              ></button>
              <button
                class="toggle-btn"
                data-mode="source"
                aria-pressed="false"
                data-i18n="reader.view.source"
              ></button>
            </div>
            <button
              class="window-close-btn"
              title="关闭"
              aria-label="关闭窗口"
              data-i18n-title="reader.close.title"
              data-i18n-aria-label="reader.close.ariaLabel"
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="content-container" class="content-container">
        <!-- 文本框架组件 - 纯文本模式 -->
        <div id="text-fallback" class="text-frame mode-text ghost-scrollbar">
          <div class="text-content" contenteditable="true"></div>
        </div>

        <iframe
          id="html-frame"
          class="content-frame"
          sandbox="allow-same-origin allow-scripts"
        ></iframe>

        <!-- 文本框架组件 - 源码模式 -->
        <div
          id="source-view"
          class="text-frame mode-source ghost-scrollbar"
          contenteditable="true"
        >
          <div class="text-content"></div>
        </div>
      </div>

      <div class="bottom-buttons">
        <div class="navigation-buttons">
          <button class="nav-btn prev-btn">
            <span class="icon icon-prev"></span>
            <span data-i18n="reader.nav.prev"></span>
          </button>
          <button class="nav-btn next-btn">
            <span data-i18n="reader.nav.next"></span>
            <span class="icon icon-next"></span>
          </button>
        </div>
        <div class="button-group">
          <button class="action-btn favorite-btn">
            <span class="icon icon-favorite-solid"></span>
            <span class="btn-text" data-i18n="reader.favorite.add"></span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
